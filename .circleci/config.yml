version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            pytest --junitxml=test-results/junit.xml
          when: always
      - store_test_results:
          path: test-results

workflows:
  build-and-test:
    jobs:
      - test
